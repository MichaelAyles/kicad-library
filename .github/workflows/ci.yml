name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Type check (API worker)
        run: npm run typecheck:worker

      - name: Test
        run: npm test

      # A static export of every page. Circuit pages are skipped (they need
      # the live database); the shell page they fall back to is still built.
      # The Supabase client throws at import without these; placeholders are
      # enough, since nothing talks to Supabase during this build.
      - name: Build
        run: npm run build
        env:
          CIRCUITSNIPS_SKIP_CIRCUIT_PAGES: 1
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          NEXT_TELEMETRY_DISABLED: 1

      # Bundles the API worker with the static assets, without deploying
      - name: Bundle worker
        run: npx wrangler deploy --dry-run --outdir dist-worker
